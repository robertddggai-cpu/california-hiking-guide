<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>California Recommended Day Routes</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #020403;
  --surface: #07130d;
  --surface-2: #0d1d13;
  --surface-3: #102719;
  --ink: #edf7ee;
  --muted: #a7b8aa;
  --line: #244231;
  --forest: #2f8f5b;
  --forest-dark: #0b2d1d;
  --coast: #63b7aa;
  --clay: #cf7b4c;
  --gold: #d5ad55;
  --focus: #9ccfff;
  --shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Trebuchet MS", "Segoe UI", serif;
  line-height: 1.5;
}

a {
  color: var(--forest-dark);
}

a:hover {
  color: var(--coast);
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
.file-action,
.topbar-link {
  border: 1px solid var(--forest);
  background: var(--forest);
  color: #fff;
  border-radius: 6px;
  min-height: 42px;
  padding: 0.55rem 0.8rem;
  cursor: pointer;
  font-weight: 700;
}

button:hover,
.file-action:hover,
.topbar-link:hover {
  background: var(--forest-dark);
  color: #fff;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #b9c2bc;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  min-height: 42px;
  padding: 0.55rem 0.65rem;
}

textarea {
  resize: vertical;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: 1rem;
  top: 0.5rem;
  z-index: 10;
  transform: translateY(-140%);
  background: #fff;
  border: 2px solid var(--focus);
  border-radius: 4px;
  color: var(--ink);
  padding: 0.5rem 0.75rem;
}

.skip-link:focus {
  transform: translateY(0);
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: center;
  padding: 1.25rem clamp(1rem, 4vw, 3rem);
  background: #fff;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  margin: 0 0 0.15rem;
  color: var(--clay);
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(1.6rem, 3vw, 2.6rem);
  letter-spacing: 0;
}

h2 {
  margin-bottom: 0.75rem;
  font-size: 1.25rem;
  letter-spacing: 0;
}

h3 {
  margin-bottom: 0.35rem;
  font-size: 1.1rem;
  letter-spacing: 0;
}

main {
  width: min(1180px, calc(100% - 2rem));
  margin: 1.25rem auto 3rem;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: flex-end;
}

.topbar-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.park-menu,
.route-menu {
  position: relative;
}

#parks-toggle,
#routes-toggle {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
}

#parks-toggle small,
#routes-toggle small {
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.78rem;
  font-weight: 800;
}

.parks-menu,
.routes-menu {
  position: absolute;
  top: calc(100% + 0.45rem);
  right: 0;
  z-index: 20;
  display: grid;
  gap: 0.2rem;
  width: 280px;
  max-height: min(68vh, 460px);
  overflow: auto;
  padding: 0.45rem;
  border: 1px solid rgba(99, 117, 102, 0.28);
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 18px 40px rgba(25, 33, 29, 0.18);
}

.routes-menu {
  width: 320px;
}

.parks-menu[hidden],
.routes-menu[hidden] {
  display: none;
}

.parks-menu button,
.routes-menu button {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: center;
  width: 100%;
  min-height: 38px;
  padding: 0.45rem 0.55rem;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font-size: 0.86rem;
  text-align: left;
}

.parks-menu button:hover,
.parks-menu button.active,
.routes-menu button:hover,
.routes-menu button.active {
  border-color: color-mix(in srgb, var(--group-color) 38%, #ffffff);
  background: color-mix(in srgb, var(--group-color) 10%, #ffffff);
}

.parks-menu button span,
.routes-menu button span {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
  min-width: 0;
}

.parks-menu button i,
.routes-menu button i {
  flex: 0 0 auto;
  width: 0.72rem;
  height: 0.72rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.parks-menu button strong,
.routes-menu button strong {
  color: var(--muted);
  font-size: 0.78rem;
}

.file-action {
  display: inline-flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.file-action input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.summary,
.roadmap,
.filters {
  margin-bottom: 1rem;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.stat strong {
  display: block;
  font-size: 1.65rem;
  line-height: 1.1;
}

.stat span {
  color: var(--muted);
  font-weight: 700;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}

.save-status,
.result-count {
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 700;
}

.route-visual {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.map-shell {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto auto;
}

.map-canvas {
  position: relative;
  aspect-ratio: 1000 / 760;
  min-height: 0;
  overflow: hidden;
  background: #d7edf1;
}

.terrain-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.neighbor-land {
  fill: #f1ead9;
  opacity: 0.9;
}

.california-shape {
  fill: url(#california-land);
  stroke: #637566;
  stroke-width: 3;
}

.desert-wash {
  fill: #eadfc7;
  opacity: 0.62;
}

.sierra-band {
  fill: none;
  stroke: #89a889;
  stroke-linecap: round;
  stroke-width: 30;
  opacity: 0.44;
}

.valley-line {
  fill: none;
  stroke: #d4bd79;
  stroke-dasharray: 12 13;
  stroke-linecap: round;
  stroke-width: 6;
  opacity: 0.78;
}

.coast-line {
  fill: none;
  stroke: #226c86;
  stroke-linecap: round;
  stroke-width: 7;
}

.highway-line,
.state-line {
  fill: none;
  stroke-linecap: round;
}

.highway-line {
  stroke: #ffffff;
  stroke-dasharray: 7 10;
  stroke-width: 3;
  opacity: 0.86;
}

.state-line {
  stroke: #748276;
  stroke-dasharray: 8 9;
  stroke-width: 3;
  opacity: 0.62;
}

.map-label,
.map-road {
  fill: #355145;
  font-weight: 800;
  letter-spacing: 0;
}

.map-label {
  font-size: 24px;
  opacity: 0.72;
}

.ocean-label {
  fill: #226c86;
}

.map-road {
  font-size: 18px;
  opacity: 0.55;
}

.city-marker circle {
  fill: #355145;
  opacity: 0.85;
}

.city-marker text {
  fill: #355145;
  font-size: 15px;
  font-weight: 800;
  opacity: 0.72;
}

.place-marker path {
  fill: rgba(255, 255, 255, 0.94);
  stroke: rgba(166, 79, 42, 0.48);
  stroke-width: 2;
}

.place-marker circle {
  fill: var(--clay);
  stroke: #fff;
  stroke-width: 2;
}

.place-marker text {
  fill: var(--clay);
  font-size: 20px;
  font-weight: 900;
}

.map-pin-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.pin-leader-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.pin-leader {
  stroke: rgba(53, 81, 69, 0.36);
  stroke-linecap: round;
  stroke-dasharray: 4 5;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.map-group-label {
  position: absolute;
  display: inline-flex;
  gap: 0.4rem;
  align-items: center;
  max-width: 170px;
  padding: 0.34rem 0.5rem;
  transform: translate(-50%, -50%);
  border: 1px solid color-mix(in srgb, var(--group-color) 44%, #ffffff);
  border-left: 5px solid var(--group-color);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 8px 20px rgba(25, 33, 29, 0.12);
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 900;
  line-height: 1.05;
  pointer-events: none;
  z-index: 1;
}

.map-group-label strong {
  display: grid;
  place-items: center;
  min-width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: var(--group-color);
  color: #fff;
  font-size: 0.72rem;
}

.map-pin {
  position: absolute;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  min-height: 32px;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  padding: 0;
  pointer-events: auto;
  z-index: 2;
}

.map-pin-dot {
  display: block;
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--group-color, var(--forest));
  box-shadow: 0 5px 12px rgba(25, 33, 29, 0.3);
  transition: filter 140ms ease, transform 140ms ease;
}

.map-pin:hover .map-pin-dot,
.map-pin:focus-visible .map-pin-dot {
  filter: brightness(0.88) saturate(1.08);
  transform: scale(1.28);
}

.map-pin.active .map-pin-dot {
  outline: 4px solid rgba(255, 255, 255, 0.95);
  transform: scale(1.3);
}

.map-pin.visited .map-pin-dot {
  box-shadow: 0 0 0 4px rgba(34, 108, 134, 0.34), 0 5px 12px rgba(25, 33, 29, 0.3);
}

.map-pin.planned .map-pin-dot {
  box-shadow: 0 0 0 4px rgba(184, 135, 24, 0.34), 0 5px 12px rgba(25, 33, 29, 0.3);
}

.map-tooltip {
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 50%;
  width: max-content;
  max-width: 230px;
  padding: 0.45rem 0.6rem;
  transform: translate(-50%, 0.25rem);
  border: 1px solid rgba(99, 117, 102, 0.28);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 10px 24px rgba(25, 33, 29, 0.18);
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.25;
  opacity: 0;
  pointer-events: none;
  text-align: left;
  transition: opacity 140ms ease, transform 140ms ease;
  visibility: hidden;
}

.map-tooltip strong,
.map-tooltip span,
.map-tooltip small {
  display: block;
}

.map-tooltip span {
  margin-top: 0.16rem;
  color: var(--muted);
}

.map-tooltip small {
  margin-top: 0.24rem;
  color: var(--group-color, var(--forest-dark));
  font-size: 0.72rem;
  font-weight: 900;
}

.map-pin:hover .map-tooltip,
.map-pin:focus-visible .map-tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
  visibility: visible;
}

.map-pin.tooltip-left .map-tooltip {
  right: 0;
  left: auto;
  transform: translate(0, 0.25rem);
}

.map-pin.tooltip-left:hover .map-tooltip,
.map-pin.tooltip-left:focus-visible .map-tooltip,
.map-pin.tooltip-right:hover .map-tooltip,
.map-pin.tooltip-right:focus-visible .map-tooltip {
  transform: translate(0, 0);
}

.map-pin.tooltip-right .map-tooltip {
  right: auto;
  left: 0;
  transform: translate(0, 0.25rem);
}

.map-legend {
  position: absolute;
  right: 0.85rem;
  bottom: 0.85rem;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.3rem 0.45rem;
  width: min(430px, calc(100% - 1.7rem));
  padding: 0.55rem 0.65rem;
  border: 1px solid rgba(99, 117, 102, 0.25);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 10px 26px rgba(25, 33, 29, 0.12);
  font-size: 0.74rem;
  font-weight: 800;
}

.map-legend b {
  flex: 0 0 100%;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
}

.map-legend-item {
  display: inline-flex;
  gap: 0.3rem;
  align-items: center;
  white-space: nowrap;
}

.map-legend-item i {
  width: 0.66rem;
  height: 0.66rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.map-panel {
  border-top: 1px solid var(--line);
  padding: 1.1rem;
  background: #fff;
}

.map-panel h3 {
  font-size: 1.25rem;
}

.map-form {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-top: 0.85rem;
}

.difficulty-block {
  display: grid;
  gap: 0.35rem;
}

.difficulty-row {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: baseline;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
}

.difficulty-row strong {
  color: var(--ink);
}

.difficulty-meter {
  height: 14px;
  border: 1px solid #c6d2cc;
  border-radius: 999px;
  background: linear-gradient(90deg, #e7f5ef, #fff2c8 47%, #f2d1be 74%, #d8a09b);
  overflow: hidden;
}

.difficulty-meter span {
  display: block;
  height: 100%;
  background: rgba(18, 68, 47, 0.82);
}

.difficulty-basis {
  margin: 0.75rem 0 0;
  color: var(--muted);
  font-size: 0.93rem;
}

.nearest-park {
  margin: 0.2rem 0 0.75rem;
  color: var(--clay);
  font-size: 0.9rem;
  font-weight: 900;
}

.weather-block {
  margin-top: 0.85rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.weather-heading {
  display: flex;
  gap: 0.75rem;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 0.55rem;
}

.weather-heading h4,
.weather-heading p {
  margin: 0;
}

.weather-heading h4 {
  font-size: 0.98rem;
}

.weather-heading p {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.weather-refresh {
  min-height: 32px;
  padding: 0.32rem 0.55rem;
  border-color: #b9c2bc;
  background: #fff;
  color: var(--forest-dark);
  font-size: 0.78rem;
}

.weather-refresh:hover {
  border-color: var(--forest);
  background: #edf5ef;
}

.weather-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(84px, 1fr));
  gap: 0.4rem;
  overflow-x: auto;
  padding-bottom: 0.1rem;
}

.weather-day {
  display: grid;
  gap: 0.18rem;
  min-width: 84px;
  border-left: 3px solid var(--coast);
  padding: 0.42rem 0.5rem;
  background: #f8fbf8;
}

.weather-day-top {
  display: flex;
  justify-content: space-between;
  gap: 0.35rem;
  align-items: center;
}

.weather-day strong {
  font-size: 0.78rem;
}

.weather-day .weather-condition,
.weather-day small {
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 800;
}

.weather-day b {
  font-size: 0.86rem;
}

.weather-icon {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  overflow: visible;
}

.weather-icon line,
.weather-icon path,
.weather-icon circle,
.weather-icon polygon {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.weather-sun-fill {
  fill: #f7c948;
  stroke: #b88718;
  stroke-width: 2;
}

.weather-sun-rays,
.weather-lines,
.weather-rain {
  fill: none;
  stroke-width: 3;
}

.weather-sun-rays {
  stroke: #b88718;
}

.weather-cloud-fill {
  fill: #eef3f0;
  stroke: #6a7870;
  stroke-width: 2.5;
}

.weather-lines {
  stroke: #7c8a82;
}

.weather-rain {
  stroke: #226c86;
}

.weather-snow {
  fill: #d6eef5;
  stroke: #226c86;
  stroke-width: 1.5;
}

.weather-bolt {
  fill: #f7c948;
  stroke: #a64f2a;
  stroke-width: 1.8;
}

.weather-placeholder {
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 800;
}

.source-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.85rem;
  margin-top: 0.75rem;
  font-size: 0.9rem;
  font-weight: 800;
}

.filters {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1rem;
}

.filter-grid {
  display: grid;
  grid-template-columns: minmax(80px, auto) minmax(180px, 1fr) minmax(80px, auto) minmax(180px, 1fr) minmax(80px, auto) minmax(180px, 1fr);
  gap: 0.65rem;
  align-items: center;
}

.filter-grid label,
.field label {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
}

.trail-list {
  display: grid;
  gap: 0.9rem;
}

.trail-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--forest);
  border-radius: 8px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.trail-card[data-status="Visited"],
.trail-card[data-status="Revisit"] {
  border-left-color: var(--coast);
}

.trail-card[data-status="Planned"] {
  border-left-color: var(--gold);
}

.trail-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: start;
}

.trail-stage,
.trail-meta,
.route-copy {
  color: var(--muted);
}

.trail-stage {
  margin-bottom: 0.2rem;
  font-weight: 800;
}

.trail-meta {
  margin-bottom: 0;
}

.route-copy {
  margin: 0.7rem 0;
}

.trail-badges {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.35rem;
  max-width: 420px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  border-radius: 999px;
  padding: 0.25rem 0.55rem;
  color: #fff;
  background: var(--forest);
  font-size: 0.8rem;
  font-weight: 800;
  white-space: nowrap;
}

.badge.coast {
  background: var(--coast);
}

.badge.gold {
  background: var(--gold);
}

.badge.clay {
  background: var(--clay);
}

.badge.hard {
  background: #8c2f39;
}

.trail-details {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem 1rem;
  margin: 0.75rem 0 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.trail-details div {
  min-width: 0;
}

.trail-details dt {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.trail-details dd {
  margin: 0.1rem 0 0;
}

.trail-details .detail-wide {
  grid-column: span 4;
}

.visit-form {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.field {
  display: grid;
  gap: 0.25rem;
}

.field.wide {
  grid-column: span 2;
}

.trail-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
  margin-top: 0.85rem;
  font-weight: 800;
}

.back-to-top {
  min-height: 34px;
  margin-left: auto;
  padding: 0.35rem 0.65rem;
  border-color: #b9c2bc;
  background: #fff;
  color: var(--forest-dark);
  font-size: 0.84rem;
}

.back-to-top:hover {
  border-color: var(--forest);
  background: #edf5ef;
}

.day-routes-page {
  display: grid;
  gap: 1rem;
}

.day-route-selector {
  display: grid;
  grid-template-columns: minmax(220px, 0.32fr) minmax(0, 1fr);
  gap: 1rem;
  align-items: start;
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
}

.route-group-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 0.5rem;
}

.route-group-link {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: center;
  min-height: 44px;
  padding: 0.55rem 0.65rem;
  border: 1px solid color-mix(in srgb, var(--group-color) 30%, #d8ded7);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 800;
  text-decoration: none;
}

.route-group-link:hover,
.route-group-link.active {
  background: color-mix(in srgb, var(--group-color) 10%, #ffffff);
  color: var(--ink);
}

.route-group-link span {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
  min-width: 0;
}

.route-group-link i {
  flex: 0 0 auto;
  width: 0.72rem;
  height: 0.72rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.route-group-link strong {
  color: var(--muted);
  font-size: 0.78rem;
}

.day-route-output {
  display: grid;
  gap: 1rem;
}

.day-route-heading {
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-left: 6px solid var(--group-color);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow);
}

.day-route-heading h2 {
  margin-bottom: 0.45rem;
  font-size: clamp(1.5rem, 2.4vw, 2.15rem);
}

.day-route-heading p:last-child {
  max-width: 76ch;
  margin-bottom: 0;
  color: var(--muted);
}

.route-plan-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.65rem;
}

.route-plan-card {
  display: grid;
  gap: 0.25rem;
  min-height: 78px;
  padding: 0.75rem 0.85rem;
  border: 1px solid var(--line);
  border-left: 5px solid var(--forest);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  box-shadow: var(--shadow);
}

.route-plan-card:hover,
.route-plan-card.active {
  border-color: var(--forest);
  border-left-color: var(--gold);
  background: var(--surface-2);
}

.route-plan-card span {
  font-weight: 900;
}

.route-plan-card strong {
  color: var(--muted);
  font-size: 0.82rem;
}

.day-route-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 0.65rem;
  margin: 0;

.day-route-metrics div {
  min-height: 78px;
  padding: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.day-route-metrics dt {
  margin-bottom: 0.25rem;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
}

.day-route-metrics dd {
  margin: 0;

  font-size: 1rem;
  font-weight: 850;
}

.day-route-note {
  padding: 0.85rem 1rem;

  border-radius: 8px;
  background: #fff8ea;
  color: #4f3b12;
}

.route-customizer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.8rem;
  align-items: start;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.route-customizer h3 {
  margin-bottom: 0;
}

.route-plan-actions {
  display: flex;
  justify-content: flex-end;
}

.route-plan-actions button {
  min-height: 36px;
  padding: 0.4rem 0.65rem;
  font-size: 0.84rem;
}

.route-plan-actions button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.route-swap-grid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.trail-swap {
  display: grid;
  gap: 0.3rem;
}

.trail-swap span {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 900;
  text-transform: uppercase;
}

.day-route-section {
  display: grid;
  gap: 0.65rem;
}

.day-route-section h3 {
  margin-bottom: 0;
}

.day-route-stops {
  display: grid;
  gap: 0.85rem;
}

.day-route-stop {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.85rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow);
}

.day-route-stop-number {
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 999px;
  background: var(--forest);
  color: #fff;
  font-weight: 900;
}

.day-route-stop h4,
.day-route-alternate h4 {
  margin: 0 0 0.25rem;
  font-size: 1.05rem;
}

.day-route-stop-details {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0.75rem 0;
}

.day-route-stop-details div {
  padding: 0.55rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f9fbf7;
}

.day-route-stop-details dt {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
}

.day-route-stop-details dd {
  margin: 0.15rem 0 0;
  font-weight: 850;
}

.difficulty-meter {
  width: min(320px, 100%);
  height: 0.55rem;
  overflow: hidden;
  border-radius: 999px;
  background: #e5ebe4;
}

.difficulty-meter span {
  display: block;
  width: var(--difficulty-score);
  height: 100%;

  background: linear-gradient(90deg, var(--forest), var(--gold), var(--clay));
}

.day-route-pacing {
  margin: 0;
  padding-left: 1.2rem;
}

.day-route-pacing li + li {
  margin-top: 0.35rem;
}

.day-route-alternates {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.day-route-pool {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.day-route-alternate {
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.route-pool-trail {
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.route-pool-trail.selected {
  border-color: var(--gold);

}

.route-pool-trail h4 {
  margin: 0 0 0.25rem;
}

.route-pool-trail p:last-child {
  margin-bottom: 0;
  color: var(--muted);
}

.day-route-alternate p:last-child {
  margin-bottom: 0;
  color: var(--muted);
}

const groupCache = new Map();
const elements = {
  groupLinks: document.querySelector("#route-group-links"),
  output: document.querySelector("#route-output")
};

let trails = [];
let activeGroupId = "redwood";
let activePlanId = "";
let routeCustomizations = {};
let weatherByTrailId = {};
let weatherStatus = {
  loading: false,
  error: "",
  updatedAt: 0
};

function init() {
  trails = Array.isArray(window.TRAIL_DATA) ? window.TRAIL_DATA : [];
  if (!trails.length) {
    elements.output.innerHTML = '<p class="empty-state">Trail data could not be loaded.</p>';
    return;
  }

  routeCustomizations = loadRouteCustomizations();
  loadWeatherCache();
  activeGroupId = readGroupFromUrl();
  activePlanId = readPlanFromUrl();
  renderGroupLinks();
  renderRoute();
  elements.groupLinks.addEventListener("click", handleGroupClick);
  elements.output.addEventListener("click", handleRouteClick);
  elements.output.addEventListener("change", handleRouteChange);
  document.addEventListener("click", handleWeatherRefreshClick);
  bindWeatherRefresh();
  refreshWeather({ force: true });
  window.addEventListener("popstate", () => {
    activeGroupId = readGroupFromUrl();
    activePlanId = readPlanFromUrl();
    renderGroupLinks();
    renderRoute();
  });
}

function loadRouteCustomizations() {
  try {
    return JSON.parse(localStorage.getItem(ROUTE_STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function saveRouteCustomizations() {
  localStorage.setItem(ROUTE_STORAGE_KEY, JSON.stringify(routeCustomizations));
}

function loadWeatherCache() {
  try {
    const payload = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)) || {};
    weatherByTrailId = payload.forecasts && typeof payload.forecasts === "object" ? payload.forecasts : {};
    weatherStatus.updatedAt = Number(payload.updatedAt || 0);
  } catch {
    weatherByTrailId = {};
    weatherStatus.updatedAt = 0;
  }
}

function saveWeatherCache() {
  try {
    localStorage.setItem(
      WEATHER_CACHE_KEY,
      JSON.stringify({
        updatedAt: weatherStatus.updatedAt,
        forecasts: weatherByTrailId
      })
    );
  } catch {
    // Weather is helpful but not essential; storage can fail in private windows.
  }
}

function bindWeatherRefresh() {
  window.addEventListener("online", () => refreshWeather({ force: true }));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - weatherStatus.updatedAt > WEATHER_STALE_MS) {
      refreshWeather({ force: true });
    }
  });
  window.setInterval(() => refreshWeather(), WEATHER_REFRESH_MS);
}

  const button = event.target.closest("[data-weather-refresh]");
  if (!button) return;

}

function readGroupFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("group");
  return nationalParkGroups.some((group) => group.id === requested) ? requested : nationalParkGroups[0].id;
}

function handleGroupClick(event) {
  const link = event.target.closest("[data-route-group]");
  if (!link) return;
  event.preventDefault();
  activeGroupId = link.dataset.routeGroup;
  activePlanId = "";
  history.pushState({}, "", routeHref(activeGroupId));
  renderGroupLinks();
  renderRoute();
  elements.output.scrollIntoView({ behavior: "smooth", block: "start" });
}

function handleRouteClick(event) {
  const planButton = event.target.closest("[data-route-plan]");
  if (planButton) {
    activePlanId = planButton.dataset.routePlan;
    history.pushState({}, "", routeHref(activeGroupId, activePlanId));
    renderRoute();
    return;
  }

  const resetButton = event.target.closest("[data-reset-route]");
  if (resetButton) {
    delete routeCustomizations[routeKey(activeGroupId, activePlanId)];
    saveRouteCustomizations();
    renderRoute();
  }

function handleRouteChange(event) {
  const select = event.target.closest("[data-swap-stop-index]");
  if (!select) return;

  const group = getActiveGroup();
  const plan = getActivePlan(group);
  const selectedStopIds = getSelectedStopIds(plan);
  selectedStopIds[Number(select.dataset.swapStopIndex)] = select.value;
  routeCustomizations[routeKey(activeGroupId, plan.id)] = selectedStopIds;
  saveRouteCustomizations();
  renderRoute();
}

function getActiveGroup() {
  return nationalParkGroups.find((item) => item.id === activeGroupId) || nationalParkGroups[0];
}

function getActivePlan(group) {
  const plans = getPlansForGroup(group);
  return plans.find((item) => item.id === activePlanId) || plans[0] || fallbackPlan(group);
}

function getPlansForGroup(group) {
  const curated = (curatedRoutePlans[group.id] || []).filter((plan) => plan.stopIds.some(findTrail));
  const supplemental = supplementalPlans(group, curated);
  const plans = [...curated, ...supplemental];
  return plans.length ? plans : [fallbackPlan(group)];
}

function supplementalPlans(group, curated) {
  const used = new Set(curated.flatMap((plan) => [...plan.stopIds, ...(plan.alternateIds || [])]));
  const candidates = getTrailsForGroup(group.id)
    .filter((trail) => isDayFriendlyTrail(trail) && !used.has(trail.id))
    .sort((a, b) => {
      const segment = a.segment.localeCompare(b.segment);
      if (segment) return segment;
      const priority = priorityScore(b.priority) - priorityScore(a.priority);
      if (priority) return priority;
      return a.distanceMi - b.distanceMi;
    });

  const chunks = [];
  let current = [];
  let miles = 0;
  let segment = "";

  for (const trail of candidates) {
    const segmentChanged = segment && trail.segment !== segment;
    const tooFull = current.length >= 3 || (current.length && miles + Number(trail.distanceMi || 0) > 12);
    if (segmentChanged || tooFull) {
      chunks.push(current);
      current = [];
      miles = 0;
    }
    current.push(trail);
    miles += Number(trail.distanceMi || 0);
    segment = trail.segment;
  }
  if (current.length) chunks.push(current);

  return chunks.map((chunk, index) => ({
    id: `${group.id}-more-${index + 1}`,
    title: `${chunk[0].segment} Route ${index + 1}`,
    base: chunk[0].baseTown,
    duration: "Flexible day",
    summary: `Additional day-sized route option from the ${chunk[0].segment} trail set.`,
    stopIds: chunk.map((trail) => trail.id),
    alternateIds: [],
    pacing: ["Start with the longest or hottest trail, then keep shorter stops as add-ons."],
    caution: "Check conditions, permits, road closures, and daylight before going."
  }));
}

function isDayFriendlyTrail(trail) {
  const time = String(trail.time || "").toLowerCase();
  if (time.includes("days")) return false;
  if (time.includes("backpack") && Number(trail.distanceMi || 0) > 10) return false;
  return Number(trail.distanceMi || 0) <= 16.5;
}

function fallbackPlan(group) {
  const dayFriendly = getTrailsForGroup(group.id)
    .filter(isDayFriendlyTrail)
    .sort((a, b) => {
      const priority = priorityScore(b.priority) - priorityScore(a.priority);
      if (priority) return priority;
      return a.distanceMi - b.distanceMi;
    });

  return {
    id: `${group.id}-route`,
    title: `${group.name} Day Route`,
    base: group.name,
    duration: "Flexible day",
    summary: "A compact route assembled from day-friendly trails in this group.",
    stopIds: dayFriendly.slice(0, 3).map((trail) => trail.id),
    alternateIds: dayFriendly.slice(3, 6).map((trail) => trail.id),
    pacing: ["Start with the longest hike, then keep shorter stops as optional add-ons."],
    caution: "Check conditions, permits, road closures, and daylight before going."
  };
}

function getSelectedStopIds(plan) {
  const saved = routeCustomizations[routeKey(activeGroupId, plan.id)];
  if (Array.isArray(saved) && saved.length === plan.stopIds.length && saved.every(findTrail)) {
    return [...saved];
  }
  return [...plan.stopIds];
}

function getSwapOptions(groupId, selectedStopIds, plan) {
  const optionMap = new Map();
  for (const trail of getTrailsForGroup(groupId)) optionMap.set(trail.id, trail);
  for (const id of [...selectedStopIds, ...plan.stopIds, ...(plan.alternateIds || [])]) {
    const trail = findTrail(id);
    if (trail) optionMap.set(trail.id, trail);
  }
  return [...optionMap.values()].sort((a, b) => a.stage - b.stage);
}

function getAlternateTrails(plan, selectedStopIds) {
  return (plan.alternateIds || [])
    .map(findTrail)
    .filter((trail) => trail && !selectedStopIds.includes(trail.id));
}

function routeTotals(stopTrails) {
  const totals = stopTrails.reduce(
    (memo, trail) => {
      memo.distanceMi += Number(trail.distanceMi || 0);
      memo.elevationFt += Number(trail.elevationFt || 0);
      memo.difficulty = Math.max(memo.difficulty, Number(trail.communityDifficulty || 0));
      return memo;
    },
    { distanceMi: 0, elevationFt: 0, difficulty: 0 }
  );

  return {
    distanceMi: totals.distanceMi,
    elevationFt: Math.round(totals.elevationFt),
    difficulty: totals.difficulty || "?"
  };
}

function routeKey(groupId, planId) {
  return `${groupId}:${planId}`;
}

function priorityScore(priority) {
  if (priority === "Iconic") return 3;
  if (priority === "Popular") return 2;
  return 1;
}

function findTrail(id) {
  return trails.find((trail) => trail.id === id);
}

function getTrailsForGroup(groupId) {
  return trails.filter((trail) => getNearestNationalPark(trail).id === groupId);
}

function countNationalParkGroups(trailList = trails) {
  const counts = new Map(nationalParkGroups.map((group) => [group.id, 0]));
  for (const trail of trailList) {
    const group = getNearestNationalPark(trail);
    counts.set(group.id, (counts.get(group.id) || 0) + 1);
  }
  return counts;
}

function getNearestNationalPark(trail) {
  if (groupCache.has(trail.id)) return groupCache.get(trail.id);

  let nearest = nationalParkGroups[0];
  let bestDistance = Number.POSITIVE_INFINITY;
  for (const group of nationalParkGroups) {
    const distance = milesBetween(trail.lat, trail.lng, group.lat, group.lng);
    if (distance < bestDistance) {
      nearest = group;
      bestDistance = distance;
    }
  }

  const result = { ...nearest, distanceMi: bestDistance };
  groupCache.set(trail.id, result);
  return result;
}

function milesBetween(lat1, lng1, lat2, lng2) {
  const earthRadiusMi = 3958.8;
  const toRad = (value) => value * (Math.PI / 180);
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return earthRadiusMi * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function difficultyScore(trail) {
  const score = Number(trail.communityDifficulty || 0);
  return Math.max(5, Math.min(100, score * 10));
}

function weatherMarkup(trail) {

function weatherContentMarkup(trail) {

  return `

    </div>

}

function weatherDayMarkup(day) {

    <article class="weather-day">

        ${weatherIconMarkup(day.weatherCode)}

function weatherIconMarkup(code) {
  const type = weatherIconType(code);
  const common = 'class="weather-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"';

  if (type === "sun") {

          <line x1="4" y1="24" x2="10" y2="24"></line>
          <line x1="38" y1="24" x2="44" y2="24"></line>
          <line x1="10" y1="10" x2="14" y2="14"></line>
          <line x1="34" y1="34" x2="38" y2="38"></line>
          <line x1="38" y1="10" x2="34" y2="14"></line>
          <line x1="14" y1="34" x2="10" y2="38"></line>
        </g>
      </svg>`;

  if (type === "partly") {

      </svg>`;
  }

  if (type === "fog") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <g class="weather-lines">
          <line x1="10" y1="35" x2="38" y2="35"></line>
          <line x1="7" y1="41" x2="31" y2="41"></line>
        </g>
      </svg>`;
  }

  if (type === "rain") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <g class="weather-rain">
          <line x1="16" y1="35" x2="13" y2="42"></line>
          <line x1="25" y1="35" x2="22" y2="42"></line>
          <line x1="34" y1="35" x2="31" y2="42"></line>
        </g>
      </svg>`;
  }

  if (type === "snow") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}

          <circle cx="16" cy="39" r="2"></circle>
          <circle cx="25" cy="42" r="2"></circle>
          <circle cx="34" cy="39" r="2"></circle>

  if (type === "storm") {
    return `
      <svg ${common}>

  return `
    <svg ${common}>
      ${weatherCloudPath()}
    </svg>`;
}

function weatherCloudPath() {
  return '<path class="weather-cloud-fill" d="M15 34h20a8 8 0 0 0 0-16c-1.2 0-2.4.3-3.5.8A11 11 0 0 0 10.7 23 6.2 6.2 0 0 0 15 34Z"></path>';
}

function weatherIconType(code) {
  const weatherCode = Number(code);
  if (weatherCode === 0 || weatherCode === 1) return "sun";
  if (weatherCode === 2) return "partly";
  if (weatherCode === 3) return "cloud";
  if (weatherCode === 45 || weatherCode === 48) return "fog";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(weatherCode)) return "rain";
  if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) return "snow";
  if ([95, 96, 99].includes(weatherCode)) return "storm";
  return "cloud";
}

function formatWeatherDay(date) {
  const parsed = new Date(`${date}T12:00:00`);
  if (Number.isNaN(parsed.getTime())) return date;
  return parsed.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
}

function formatWeatherUpdated(timestamp) {
  const ageMs = Date.now() - timestamp;
  const ageMin = Math.max(0, Math.round(ageMs / 60000));
  if (ageMin < 1) return "just now";
  if (ageMin < 60) return `${ageMin} min ago`;
  const ageHours = Math.round(ageMin / 60);
  return `${ageHours} hr ago`;
}

async function refreshWeather({ force = false } = {}) {
  if (weatherStatus.loading) return;
  if (!force && Date.now() - weatherStatus.updatedAt < WEATHER_REFRESH_MS) return;

  weatherStatus.loading = true;
  weatherStatus.error = "";
  updateWeatherDisplays();

  try {
    weatherByTrailId = await fetchWeatherForTrails(trails);
    weatherStatus.updatedAt = Date.now();
    weatherStatus.error = "";
    saveWeatherCache();
  } catch {
    weatherStatus.error = "Weather is temporarily unavailable.";
  } finally {
    weatherStatus.loading = false;
    updateWeatherDisplays();
  }
}

async function fetchWeatherForTrails(trailList) {
  const result = {};
  const chunks = [];
  for (let i = 0; i < trailList.length; i += WEATHER_BATCH_SIZE) {
    chunks.push(trailList.slice(i, i + WEATHER_BATCH_SIZE));
  }

  const chunkResults = await Promise.all(chunks.map(fetchWeatherBatch));
  for (const chunkResult of chunkResults) {
    Object.assign(result, chunkResult);
  }
  return result;
}

async function fetchWeatherBatch(trailChunk) {
  const params = new URLSearchParams({
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",
    timezone: "auto",
    forecast_days: "7"
  });
  params.set("latitude", trailChunk.map((trail) => Number(trail.lat).toFixed(4)).join(","));
  params.set("longitude", trailChunk.map((trail) => Number(trail.lng).toFixed(4)).join(","));

  const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
  if (!response.ok) throw new Error("Weather request failed");

  const payload = await response.json();
  if (payload.error) throw new Error(payload.reason || "Weather request failed");

  const locations = Array.isArray(payload) ? payload : [payload];
  const result = {};
  trailChunk.forEach((trail, index) => {
    const location = locations[index];
    if (!location || !location.daily) return;
    result[trail.id] = normalizeWeatherForecast(location.daily);
  });
  return result;
}

function normalizeWeatherForecast(daily) {
  const times = daily.time || [];
  return {
    days: times.slice(0, 7).map((date, index) => ({
      date,
      weatherCode: Number(daily.weather_code?.[index] ?? -1),
      summary: weatherCodeText(daily.weather_code?.[index]),
      high: Number(daily.temperature_2m_max?.[index] ?? 0),
      low: Number(daily.temperature_2m_min?.[index] ?? 0),
      precipProbability: Number(daily.precipitation_probability_max?.[index] ?? 0),
      windMax: Number(daily.wind_speed_10m_max?.[index] ?? 0)
    }))
  };
}

function weatherCodeText(code) {
  const weatherCode = Number(code);
  if (weatherCode === 0) return "Clear";
  if (weatherCode === 1) return "Mostly clear";
  if (weatherCode === 2) return "Partly cloudy";
  if (weatherCode === 3) return "Overcast";
  if (weatherCode === 45 || weatherCode === 48) return "Fog";
  if ([51, 53, 55, 56, 57].includes(weatherCode)) return "Drizzle";
  if ([61, 63, 65, 66, 67].includes(weatherCode)) return "Rain";
  if ([71, 73, 75, 77].includes(weatherCode)) return "Snow";
  if ([80, 81, 82].includes(weatherCode)) return "Showers";
  if ([85, 86].includes(weatherCode)) return "Snow showers";
  if ([95, 96, 99].includes(weatherCode)) return "Thunderstorms";
  return "Forecast";
}

function updateWeatherDisplays() {
  document.querySelectorAll("[data-weather-id]").forEach((container) => {
    const trail = trails.find((item) => item.id === container.dataset.weatherId);
    if (!trail) return;
    container.innerHTML = weatherContentMarkup(trail);
  });
}

function routeHref(groupId, planId = "") {
  const params = new URLSearchParams({ group: groupId });
  if (planId) params.set("route", planId);
  return `./california-recommended-day-routes.html?${params.toString()}`;
}

function formatMiles(value) {
  const rounded = Math.round(Number(value || 0) * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString("en-US");
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

init();

    </script>
