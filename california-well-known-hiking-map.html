<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>California Well-Known Hiking Trail Log</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #020403;
  --surface: #07130d;
  --surface-2: #0d1d13;
  --surface-3: #102719;
  --ink: #edf7ee;
  --muted: #a7b8aa;
  --line: #244231;
  --forest: #2f8f5b;
  --forest-dark: #0b2d1d;
  --coast: #63b7aa;
  --clay: #cf7b4c;
  --gold: #d5ad55;
  --focus: #9ccfff;
  --shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Trebuchet MS", "Segoe UI", serif;
  line-height: 1.5;
}

a {
  color: var(--forest-dark);
}

a:hover {
  color: var(--coast);
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
.file-action,
.topbar-link {
  border: 1px solid var(--forest);
  background: var(--forest);
  color: #fff;
  border-radius: 6px;
  min-height: 42px;
  padding: 0.55rem 0.8rem;
  cursor: pointer;
  font-weight: 700;
}

button:hover,
.file-action:hover,
.topbar-link:hover {
  background: var(--forest-dark);
  color: #fff;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #b9c2bc;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  min-height: 42px;
  padding: 0.55rem 0.65rem;
}

textarea {
  resize: vertical;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: 1rem;
  top: 0.5rem;
  z-index: 10;
  transform: translateY(-140%);
  background: #fff;
  border: 2px solid var(--focus);
  border-radius: 4px;
  color: var(--ink);
  padding: 0.5rem 0.75rem;
}

.skip-link:focus {
  transform: translateY(0);
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: center;
  padding: 1.25rem clamp(1rem, 4vw, 3rem);
  background: #fff;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  margin: 0 0 0.15rem;
  color: var(--clay);
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(1.6rem, 3vw, 2.6rem);
  letter-spacing: 0;
}

h2 {
  margin-bottom: 0.75rem;
  font-size: 1.25rem;
  letter-spacing: 0;
}

h3 {
  margin-bottom: 0.35rem;
  font-size: 1.1rem;
  letter-spacing: 0;
}

main {
  width: min(1180px, calc(100% - 2rem));
  margin: 1.25rem auto 3rem;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: flex-end;
}

.topbar-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.park-menu,
.route-menu {
  position: relative;
}

#parks-toggle,
#routes-toggle {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
}

#parks-toggle small,
#routes-toggle small {
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.78rem;
  font-weight: 800;
}

.parks-menu,
.routes-menu {
  position: absolute;
  top: calc(100% + 0.45rem);
  right: 0;
  z-index: 20;
  display: grid;
  gap: 0.2rem;
  width: 280px;
  max-height: min(68vh, 460px);
  overflow: auto;
  padding: 0.45rem;
  border: 1px solid rgba(99, 117, 102, 0.28);
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 18px 40px rgba(25, 33, 29, 0.18);
}

.routes-menu {
  width: 320px;
}

.parks-menu[hidden],
.routes-menu[hidden] {
  display: none;
}

.parks-menu button,
.routes-menu button {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: center;
  width: 100%;
  min-height: 38px;
  padding: 0.45rem 0.55rem;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font-size: 0.86rem;
  text-align: left;
}

.parks-menu button:hover,
.parks-menu button.active,
.routes-menu button:hover,
.routes-menu button.active {
  border-color: color-mix(in srgb, var(--group-color) 38%, #ffffff);
  background: color-mix(in srgb, var(--group-color) 10%, #ffffff);
}

.parks-menu button span,
.routes-menu button span {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
  min-width: 0;
}

.parks-menu button i,
.routes-menu button i {
  flex: 0 0 auto;
  width: 0.72rem;
  height: 0.72rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.parks-menu button strong,
.routes-menu button strong {
  color: var(--muted);
  font-size: 0.78rem;
}

.file-action {
  display: inline-flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.file-action input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.summary,
.roadmap,
.filters {
  margin-bottom: 1rem;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.stat strong {
  display: block;
  font-size: 1.65rem;
  line-height: 1.1;
}

.stat span {
  color: var(--muted);
  font-weight: 700;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}

.save-status,
.result-count {
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 700;
}

.route-visual {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.map-shell {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto auto;
}

.map-canvas {
  position: relative;
  aspect-ratio: 1000 / 760;
  min-height: 0;
  overflow: hidden;
  background: #d7edf1;
}

.terrain-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.neighbor-land {
  fill: #f1ead9;
  opacity: 0.9;
}

.california-shape {
  fill: url(#california-land);
  stroke: #637566;
  stroke-width: 3;
}

.desert-wash {
  fill: #eadfc7;
  opacity: 0.62;
}

.sierra-band {
  fill: none;
  stroke: #89a889;
  stroke-linecap: round;
  stroke-width: 30;
  opacity: 0.44;
}

.valley-line {
  fill: none;
  stroke: #d4bd79;
  stroke-dasharray: 12 13;
  stroke-linecap: round;
  stroke-width: 6;
  opacity: 0.78;
}

.coast-line {
  fill: none;
  stroke: #226c86;
  stroke-linecap: round;
  stroke-width: 7;
}

.highway-line,
.state-line {
  fill: none;
  stroke-linecap: round;
}

.highway-line {
  stroke: #ffffff;
  stroke-dasharray: 7 10;
  stroke-width: 3;
  opacity: 0.86;
}

.state-line {
  stroke: #748276;
  stroke-dasharray: 8 9;
  stroke-width: 3;
  opacity: 0.62;
}

.map-label,
.map-road {
  fill: #355145;
  font-weight: 800;
  letter-spacing: 0;
}

.map-label {
  font-size: 24px;
  opacity: 0.72;
}

.ocean-label {
  fill: #226c86;
}

.map-road {
  font-size: 18px;
  opacity: 0.55;
}

.city-marker circle {
  fill: #355145;
  opacity: 0.85;
}

.city-marker text {
  fill: #355145;
  font-size: 15px;
  font-weight: 800;
  opacity: 0.72;
}

.place-marker path {
  fill: rgba(255, 255, 255, 0.94);
  stroke: rgba(166, 79, 42, 0.48);
  stroke-width: 2;
}

.place-marker circle {
  fill: var(--clay);
  stroke: #fff;
  stroke-width: 2;
}

.place-marker text {
  fill: var(--clay);
  font-size: 20px;
  font-weight: 900;
}

.map-pin-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.pin-leader-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.pin-leader {
  stroke: rgba(53, 81, 69, 0.36);
  stroke-linecap: round;
  stroke-dasharray: 4 5;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.map-group-label {
  position: absolute;
  display: inline-flex;
  gap: 0.4rem;
  align-items: center;
  max-width: 170px;
  padding: 0.34rem 0.5rem;
  transform: translate(-50%, -50%);
  border: 1px solid color-mix(in srgb, var(--group-color) 44%, #ffffff);
  border-left: 5px solid var(--group-color);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 8px 20px rgba(25, 33, 29, 0.12);
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 900;
  line-height: 1.05;
  pointer-events: none;
  z-index: 1;
}

.map-group-label strong {
  display: grid;
  place-items: center;
  min-width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: var(--group-color);
  color: #fff;
  font-size: 0.72rem;
}

.map-pin {
  position: absolute;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  min-height: 32px;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  padding: 0;
  pointer-events: auto;
  z-index: 2;
}

.map-pin-dot {
  display: block;
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--group-color, var(--forest));
  box-shadow: 0 5px 12px rgba(25, 33, 29, 0.3);
  transition: filter 140ms ease, transform 140ms ease;
}

.map-pin:hover .map-pin-dot,
.map-pin:focus-visible .map-pin-dot {
  filter: brightness(0.88) saturate(1.08);
  transform: scale(1.28);
}

.map-pin.active .map-pin-dot {
  outline: 4px solid rgba(255, 255, 255, 0.95);
  transform: scale(1.3);
}

.map-pin.visited .map-pin-dot {
  box-shadow: 0 0 0 4px rgba(34, 108, 134, 0.34), 0 5px 12px rgba(25, 33, 29, 0.3);
}

.map-pin.planned .map-pin-dot {
  box-shadow: 0 0 0 4px rgba(184, 135, 24, 0.34), 0 5px 12px rgba(25, 33, 29, 0.3);
}

.map-tooltip {
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 50%;
  width: max-content;
  max-width: 230px;
  padding: 0.45rem 0.6rem;
  transform: translate(-50%, 0.25rem);
  border: 1px solid rgba(99, 117, 102, 0.28);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 10px 24px rgba(25, 33, 29, 0.18);
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.25;
  opacity: 0;
  pointer-events: none;
  text-align: left;
  transition: opacity 140ms ease, transform 140ms ease;
  visibility: hidden;
}

.map-tooltip strong,
.map-tooltip span,
.map-tooltip small {
  display: block;
}

.map-tooltip span {
  margin-top: 0.16rem;
  color: var(--muted);
}

.map-tooltip small {
  margin-top: 0.24rem;
  color: var(--group-color, var(--forest-dark));
  font-size: 0.72rem;
  font-weight: 900;
}

.map-pin:hover .map-tooltip,
.map-pin:focus-visible .map-tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
  visibility: visible;
}

.map-pin.tooltip-left .map-tooltip {
  right: 0;
  left: auto;
  transform: translate(0, 0.25rem);
}

.map-pin.tooltip-left:hover .map-tooltip,
.map-pin.tooltip-left:focus-visible .map-tooltip,
.map-pin.tooltip-right:hover .map-tooltip,
.map-pin.tooltip-right:focus-visible .map-tooltip {
  transform: translate(0, 0);
}

.map-pin.tooltip-right .map-tooltip {
  right: auto;
  left: 0;
  transform: translate(0, 0.25rem);
}

.map-legend {
  position: absolute;
  right: 0.85rem;
  bottom: 0.85rem;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.3rem 0.45rem;
  width: min(430px, calc(100% - 1.7rem));
  padding: 0.55rem 0.65rem;
  border: 1px solid rgba(99, 117, 102, 0.25);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 10px 26px rgba(25, 33, 29, 0.12);
  font-size: 0.74rem;
  font-weight: 800;
}

.map-legend b {
  flex: 0 0 100%;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
}

.map-legend-item {
  display: inline-flex;
  gap: 0.3rem;
  align-items: center;
  white-space: nowrap;
}

.map-legend-item i {
  width: 0.66rem;
  height: 0.66rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.map-panel {
  border-top: 1px solid var(--line);
  padding: 1.1rem;
  background: #fff;
}

.map-panel h3 {
  font-size: 1.25rem;
}

.map-form {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-top: 0.85rem;
}

.difficulty-block {
  display: grid;
  gap: 0.35rem;
}

.difficulty-row {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: baseline;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
}

.difficulty-row strong {
  color: var(--ink);
}

.difficulty-meter {
  height: 14px;
  border: 1px solid #c6d2cc;
  border-radius: 999px;
  background: linear-gradient(90deg, #e7f5ef, #fff2c8 47%, #f2d1be 74%, #d8a09b);
  overflow: hidden;
}

.difficulty-meter span {
  display: block;
  height: 100%;
  background: rgba(18, 68, 47, 0.82);
}

.difficulty-basis {
  margin: 0.75rem 0 0;
  color: var(--muted);
  font-size: 0.93rem;
}

.nearest-park {
  margin: 0.2rem 0 0.75rem;
  color: var(--clay);
  font-size: 0.9rem;
  font-weight: 900;
}

.weather-block {
  margin-top: 0.85rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.weather-heading {
  display: flex;
  gap: 0.75rem;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 0.55rem;
}

.weather-heading h4,
.weather-heading p {
  margin: 0;
}

.weather-heading h4 {
  font-size: 0.98rem;
}

.weather-heading p {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.weather-refresh {
  min-height: 32px;
  padding: 0.32rem 0.55rem;
  border-color: #b9c2bc;
  background: #fff;
  color: var(--forest-dark);
  font-size: 0.78rem;
}

.weather-refresh:hover {
  border-color: var(--forest);
  background: #edf5ef;
}

.weather-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(84px, 1fr));
  gap: 0.4rem;
  overflow-x: auto;
  padding-bottom: 0.1rem;
}

.weather-day {
  display: grid;
  gap: 0.18rem;
  min-width: 84px;
  border-left: 3px solid var(--coast);
  padding: 0.42rem 0.5rem;
  background: #f8fbf8;
}

.weather-day-top {
  display: flex;
  justify-content: space-between;
  gap: 0.35rem;
  align-items: center;
}

.weather-day strong {
  font-size: 0.78rem;
}

.weather-day .weather-condition,
.weather-day small {
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 800;
}

.weather-day b {
  font-size: 0.86rem;
}

.weather-icon {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  overflow: visible;
}

.weather-icon line,
.weather-icon path,
.weather-icon circle,
.weather-icon polygon {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.weather-sun-fill {
  fill: #f7c948;
  stroke: #b88718;
  stroke-width: 2;
}

.weather-sun-rays,
.weather-lines,
.weather-rain {
  fill: none;
  stroke-width: 3;
}

.weather-sun-rays {
  stroke: #b88718;
}

.weather-cloud-fill {
  fill: #eef3f0;
  stroke: #6a7870;
  stroke-width: 2.5;
}

.weather-lines {
  stroke: #7c8a82;
}

.weather-rain {
  stroke: #226c86;
}

.weather-snow {
  fill: #d6eef5;
  stroke: #226c86;
  stroke-width: 1.5;
}

.weather-bolt {
  fill: #f7c948;
  stroke: #a64f2a;
  stroke-width: 1.8;
}

.weather-placeholder {
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 800;
}

.source-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.85rem;
  margin-top: 0.75rem;
  font-size: 0.9rem;
  font-weight: 800;
}

.filters {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1rem;
}

.filter-grid {
  display: grid;
  grid-template-columns: minmax(80px, auto) minmax(180px, 1fr) minmax(80px, auto) minmax(180px, 1fr) minmax(80px, auto) minmax(180px, 1fr);
  gap: 0.65rem;
  align-items: center;
}

.filter-grid label,
.field label {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
}

.trail-list {
  display: grid;
  gap: 0.9rem;
}

.trail-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--forest);
  border-radius: 8px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.trail-card[data-status="Visited"],
.trail-card[data-status="Revisit"] {
  border-left-color: var(--coast);
}

.trail-card[data-status="Planned"] {
  border-left-color: var(--gold);
}

.trail-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: start;
}

.trail-stage,
.trail-meta,
.route-copy {
  color: var(--muted);
}

.trail-stage {
  margin-bottom: 0.2rem;
  font-weight: 800;
}

.trail-meta {
  margin-bottom: 0;
}

.route-copy {
  margin: 0.7rem 0;
}

.trail-badges {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.35rem;
  max-width: 420px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  border-radius: 999px;
  padding: 0.25rem 0.55rem;
  color: #fff;
  background: var(--forest);
  font-size: 0.8rem;
  font-weight: 800;
  white-space: nowrap;
}

.badge.coast {
  background: var(--coast);
}

.badge.gold {
  background: var(--gold);
}

.badge.clay {
  background: var(--clay);
}

.badge.hard {
  background: #8c2f39;
}

.trail-details {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem 1rem;
  margin: 0.75rem 0 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.trail-details div {
  min-width: 0;
}

.trail-details dt {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.trail-details dd {
  margin: 0.1rem 0 0;
}

.trail-details .detail-wide {
  grid-column: span 4;
}

.visit-form {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.field {
  display: grid;
  gap: 0.25rem;
}

.field.wide {
  grid-column: span 2;
}

.trail-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
  margin-top: 0.85rem;
  font-weight: 800;
}

.back-to-top {
  min-height: 34px;
  margin-left: auto;
  padding: 0.35rem 0.65rem;
  border-color: #b9c2bc;
  background: #fff;
  color: var(--forest-dark);
  font-size: 0.84rem;
}

.back-to-top:hover {
  border-color: var(--forest);
  background: #edf5ef;
}

.day-routes-page {
  display: grid;
  gap: 1rem;
}

.day-route-selector {
  display: grid;
  grid-template-columns: minmax(220px, 0.32fr) minmax(0, 1fr);
  gap: 1rem;
  align-items: start;
  padding: 1rem 0;
  border-bottom: 1px solid var(--line);
}

.route-group-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 0.5rem;
}

.route-group-link {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: center;
  min-height: 44px;
  padding: 0.55rem 0.65rem;
  border: 1px solid color-mix(in srgb, var(--group-color) 30%, #d8ded7);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 800;
  text-decoration: none;
}

.route-group-link:hover,
.route-group-link.active {
  background: color-mix(in srgb, var(--group-color) 10%, #ffffff);
  color: var(--ink);
}

.route-group-link span {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
  min-width: 0;
}

.route-group-link i {
  flex: 0 0 auto;
  width: 0.72rem;
  height: 0.72rem;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--group-color);
  box-shadow: 0 0 0 1px rgba(25, 33, 29, 0.16);
}

.route-group-link strong {
  color: var(--muted);
  font-size: 0.78rem;
}

.day-route-output {
  display: grid;
  gap: 1rem;
}

.day-route-heading {
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-left: 6px solid var(--group-color);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow);
}

.day-route-heading h2 {
  margin-bottom: 0.45rem;
  font-size: clamp(1.5rem, 2.4vw, 2.15rem);
}

.day-route-heading p:last-child {
  max-width: 76ch;
  margin-bottom: 0;
  color: var(--muted);
}

.route-plan-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.65rem;
}

.route-plan-card {
  display: grid;
  gap: 0.25rem;
  min-height: 78px;
  padding: 0.75rem 0.85rem;
  border: 1px solid var(--line);
  border-left: 5px solid var(--forest);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  box-shadow: var(--shadow);
}

.route-plan-card:hover,
.route-plan-card.active {
  border-color: var(--forest);
  border-left-color: var(--gold);
  background: var(--surface-2);
}

.route-plan-card span {
  font-weight: 900;
}

.route-plan-card strong {
  color: var(--muted);
  font-size: 0.82rem;
}

.day-route-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 0.65rem;
  margin: 0;
}

.day-route-metrics div {
  min-height: 78px;
  padding: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.day-route-metrics dt {
  margin-bottom: 0.25rem;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
}

.day-route-metrics dd {
  margin: 0;
  color: var(--ink);
  font-size: 1rem;
  font-weight: 850;
}

.day-route-note {
  padding: 0.85rem 1rem;
  border: 1px solid #eadcb5;
  border-radius: 8px;
  background: #fff8ea;
  color: #4f3b12;
}

.route-customizer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.8rem;
  align-items: start;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.route-customizer h3 {
  margin-bottom: 0;
}

.route-plan-actions {
  display: flex;
  justify-content: flex-end;
}

.route-plan-actions button {
  min-height: 36px;
  padding: 0.4rem 0.65rem;
  font-size: 0.84rem;
}

.route-plan-actions button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.route-swap-grid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.trail-swap {
  display: grid;
  gap: 0.3rem;
}

.trail-swap span {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 900;
  text-transform: uppercase;
}

.day-route-section {
  display: grid;
  gap: 0.65rem;
}

.day-route-section h3 {
  margin-bottom: 0;
}

.day-route-stops {
  display: grid;
  gap: 0.85rem;
}

.day-route-stop {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.85rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow);
}

.day-route-stop-number {
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 999px;
  background: var(--forest);
  color: #fff;
  font-weight: 900;
}

.day-route-stop h4,
.day-route-alternate h4 {
  margin: 0 0 0.25rem;
  font-size: 1.05rem;
}

.day-route-stop-details {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0.75rem 0;
}

.day-route-stop-details div {
  padding: 0.55rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f9fbf7;
}

.day-route-stop-details dt {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
}

.day-route-stop-details dd {
  margin: 0.15rem 0 0;
  font-weight: 850;
}

.difficulty-meter {
  width: min(320px, 100%);
  height: 0.55rem;
  overflow: hidden;
  border-radius: 999px;
  background: #e5ebe4;
}

.difficulty-meter span {
  display: block;
  width: var(--difficulty-score);
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--forest), var(--gold), var(--clay));
}

.day-route-pacing {
  margin: 0;
  padding-left: 1.2rem;
}

.day-route-pacing li + li {
  margin-top: 0.35rem;
}

.day-route-alternates {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.day-route-pool {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.75rem;
}

.day-route-alternate {
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.route-pool-trail {
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.route-pool-trail.selected {
  border-color: var(--gold);
  background: var(--surface-2);
}

.route-pool-trail h4 {
  margin: 0 0 0.25rem;
}

.route-pool-trail p:last-child {
  margin-bottom: 0;
  color: var(--muted);
}

.day-route-alternate p:last-child {
  margin-bottom: 0;
  color: var(--muted);
}

a {

.skip-link,

.neighbor-land {

.california-shape {

.desert-wash {

.sierra-band {

.valley-line {

.map-label,

.map-pin-dot {
  border-color: #ecffef;

.map-pin.active .map-pin-dot {

}

.difficulty-meter {
  border-color: #375b42;
  background: linear-gradient(90deg, #173f2a, #7e6a2d 47%, #8b472d 74%, #7f2b32);
}

.difficulty-meter span {
  background: rgba(105, 214, 141, 0.76);
}

.weather-refresh,
.back-to-top {
  border-color: #41644d;
  background: var(--surface-2);
  color: #e8ffd9;
}

.weather-refresh:hover,
.back-to-top:hover {
  border-color: var(--forest);

.weather-day,

  background: var(--surface-2);

.weather-lines {

.weather-snow {

.day-route-stop-number {

.map-label,

  .map-panel {
    border-left: 0;

  }

    grid-column: span 2;
  }
}

@media (max-width: 560px) {
  main {
    width: min(100% - 1rem, 1180px);
  }

    padding: 1rem;

    grid-template-rows: auto auto;

    aspect-ratio: 1000 / 980;
  }

  .trail-details,

  .map-group-label {
    display: none;
  }
}

    background: #fff;
  }

  .header-actions,
  .filters,
  .route-visual {
    display: none;
  }

  main {
    width: 100%;
  }

  .trail-card,
  .stat {
    box-shadow: none;
    break-inside: avoid;
  }
}

let trails = [];

let weatherStatus = {

  error: "",
  updatedAt: 0
};

function init() {
  trails = Array.isArray(window.TRAIL_DATA) ? window.TRAIL_DATA : [];
  if (!trails.length) {
    throw new Error("Trail data unavailable");
  }
  entries = loadEntries();
  loadWeatherCache();
  activeTrailId = trails[0].id;
  buildFilterOptions();
  buildParkMenuOptions();
  buildRouteMenuOptions();
  render();
  bindEvents();
  bindWeatherRefresh();
  refreshWeather({ force: true });
}

function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function loadWeatherCache() {
  try {
    const payload = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)) || {};
    weatherByTrailId = payload.forecasts && typeof payload.forecasts === "object" ? payload.forecasts : {};
    weatherStatus.updatedAt = Number(payload.updatedAt || 0);
  } catch {
    weatherByTrailId = {};
    weatherStatus.updatedAt = 0;
  }
}

function saveWeatherCache() {
  try {
    localStorage.setItem(
      WEATHER_CACHE_KEY,
      JSON.stringify({
        updatedAt: weatherStatus.updatedAt,
        forecasts: weatherByTrailId
      })
    );
  } catch {
    // Weather is helpful but not essential; storage can fail in private windows.
  }
}

function saveEntries(message = "Saved") {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  elements.saveStatus.textContent = message;
}

function getEntry(id) {
  if (!entries[id]) {
    entries[id] = { status: "Want to go" };
  }
  return entries[id];
}

function buildFilterOptions() {
  const segments = [...new Set(trails.map((trail) => trail.segment))];
  for (const segment of segments) {
    elements.segmentFilter.append(new Option(segment, segment));
  }
  for (const status of statuses) {
    elements.statusFilter.append(new Option(status, status));
  }
}

function buildParkMenuOptions() {
  const counts = countNationalParkGroups(trails);
  const allButton = parkMenuButton("all", "All Parks", trails.length, true);
  const groupButtons = nationalParkGroups.map((group) =>
    parkMenuButton(group.id, group.name, counts.get(group.id) || 0, false, group.color)
  );
  elements.parksMenu.replaceChildren(allButton, ...groupButtons);
  updateParkMenuState();
}

function parkMenuButton(id, label, count, selected, color = "var(--forest)") {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.parkGroup = id;
  button.setAttribute("role", "menuitemradio");
  button.setAttribute("aria-checked", selected ? "true" : "false");
  button.style.setProperty("--group-color", color);
  button.innerHTML = `
    <span><i aria-hidden="true"></i>${escapeHtml(label)}</span>
    <strong>${escapeHtml(String(count))}</strong>`;
  return button;
}

function buildRouteMenuOptions() {
  const counts = countNationalParkGroups(trails);
  const buttons = nationalParkGroups.map((group) =>
    routeMenuButton(group.id, group.name, counts.get(group.id) || 0, group.color)
  );
  elements.routesMenu.replaceChildren(...buttons);
}

function routeMenuButton(id, label, count, color = "var(--forest)") {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.routeGroup = id;
  button.setAttribute("role", "menuitem");
  button.style.setProperty("--group-color", color);
  button.innerHTML = `
    <span><i aria-hidden="true"></i>${escapeHtml(label)}</span>
    <strong>${escapeHtml(String(count))}</strong>`;
  return button;
}

function bindEvents() {
  elements.search.addEventListener("input", renderTrailList);
  elements.segmentFilter.addEventListener("change", renderTrailList);
  elements.statusFilter.addEventListener("change", renderTrailList);
  elements.parksToggle.addEventListener("click", handleParksToggle);
  elements.parksMenu.addEventListener("click", handleParkMenuClick);
  document.addEventListener("click", handleOutsideParkMenuClick);
  document.addEventListener("keydown", handleParkMenuKeydown);
  elements.routesToggle.addEventListener("click", handleRoutesToggle);
  elements.routesMenu.addEventListener("click", handleRouteMenuClick);
  document.addEventListener("click", handleOutsideRouteMenuClick);
  document.addEventListener("keydown", handleRouteMenuKeydown);
  elements.trailList.addEventListener("input", handleEntryInput);
  elements.trailList.addEventListener("change", handleEntryInput);
  elements.routeVisual.addEventListener("input", handleEntryInput);
  elements.routeVisual.addEventListener("change", handleEntryInput);
  elements.routeVisual.addEventListener("click", handleMapClick);
  document.addEventListener("click", handleBackToTopClick);
  document.addEventListener("click", handleWeatherRefreshClick);
  elements.exportCsv.addEventListener("click", exportCsv);
  elements.exportJson.addEventListener("click", exportJson);
  elements.importJson.addEventListener("change", importJson);
  elements.printPage.addEventListener("click", () => window.print());
}

function bindWeatherRefresh() {
  window.addEventListener("online", () => refreshWeather({ force: true }));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - weatherStatus.updatedAt > WEATHER_STALE_MS) {
      refreshWeather({ force: true });
    }
  });
  window.setInterval(() => refreshWeather(), WEATHER_REFRESH_MS);
}

function handleWeatherRefreshClick(event) {
  const button = event.target.closest("[data-weather-refresh]");
  if (!button) return;
  refreshWeather({ force: true });
}

function handleBackToTopClick(event) {
  const button = event.target.closest("[data-back-to-top]");
  if (!button) return;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function handleParksToggle(event) {
  event.stopPropagation();
  setRouteMenuOpen(false);
  setParkMenuOpen(elements.parksMenu.hidden);
}

function handleParkMenuClick(event) {
  const button = event.target.closest("[data-park-group]");
  if (!button) return;
  setParkGroup(button.dataset.parkGroup);
  setParkMenuOpen(false);
}

function handleOutsideParkMenuClick(event) {
  if (elements.parkMenu.contains(event.target)) return;
  setParkMenuOpen(false);
}

function handleParkMenuKeydown(event) {
  if (event.key !== "Escape" || elements.parksMenu.hidden) return;
  setParkMenuOpen(false);
  elements.parksToggle.focus();
}

function setParkMenuOpen(open) {
  elements.parksMenu.hidden = !open;
  elements.parksToggle.setAttribute("aria-expanded", open ? "true" : "false");
}

function handleRoutesToggle(event) {
  event.stopPropagation();
  setParkMenuOpen(false);
  setRouteMenuOpen(elements.routesMenu.hidden);
}

function handleRouteMenuClick(event) {
  const button = event.target.closest("[data-route-group]");
  if (!button) return;
  window.location.href = routePageHref(button.dataset.routeGroup);
}

function handleOutsideRouteMenuClick(event) {
  if (elements.routeMenu.contains(event.target)) return;
  setRouteMenuOpen(false);
}

function handleRouteMenuKeydown(event) {
  if (event.key !== "Escape" || elements.routesMenu.hidden) return;
  setRouteMenuOpen(false);
  elements.routesToggle.focus();
}

function setRouteMenuOpen(open) {
  elements.routesMenu.hidden = !open;
  elements.routesToggle.setAttribute("aria-expanded", open ? "true" : "false");
}

function routePageHref(groupId) {
  return `./california-recommended-day-routes.html?group=${encodeURIComponent(groupId)}`;
}

function setParkGroup(groupId) {
  activeParkGroupId = nationalParkGroups.some((group) => group.id === groupId) ? groupId : "all";
  const visible = getParkFilteredTrails();
  activeTrailId = visible[0]?.id || trails[0]?.id || "";
  updateParkMenuState();
  renderRouteVisual();
  renderTrailList();
}

function updateParkMenuState() {
  const activeGroup = getActiveParkGroup();
  elements.parksToggle.innerHTML = `<span>Parks</span>${activeGroup ? `<small>${escapeHtml(activeGroup.name)}</small>` : ""}`;
  elements.parksMenu.querySelectorAll("[data-park-group]").forEach((button) => {
    const selected = button.dataset.parkGroup === activeParkGroupId;
    button.setAttribute("aria-checked", selected ? "true" : "false");
    button.classList.toggle("active", selected);
  });
}

function getActiveParkGroup() {
  return nationalParkGroups.find((group) => group.id === activeParkGroupId) || null;
}

function getParkFilteredTrails() {
  if (activeParkGroupId === "all") return trails;
  return trails.filter((trail) => getNearestNationalPark(trail).id === activeParkGroupId);
}

function handleMapClick(event) {
  const pin = event.target.closest(".map-pin");
  if (!pin) return;
  setActiveTrail(pin.dataset.id);
}

function setActiveTrail(id) {
  if (!trails.some((trail) => trail.id === id)) return;
  activeTrailId = id;
  renderRouteVisual();
  const card = findTrailContainers(id).find((container) => container.classList.contains("trail-card"));
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function handleEntryInput(event) {
  const control = event.target.closest("[data-field]");
  if (!control) return;

  const container = control.closest("[data-id]");
  if (!container) return;

  const id = container.dataset.id;
  const entry = getEntry(id);
  entry[control.dataset.field] = control.value;
  saveEntries("Saved");
  syncControls(id, control);
  updateStatusForTrail(id);
  renderStats();

  if (control.dataset.field === "status") {
    renderRouteVisual();
    renderTrailList();
  }
}

function render() {
  renderStats();
  renderRouteVisual();
  renderTrailList();
}

function renderStats() {
  const total = trails.length;
  const visited = trails.filter((trail) => visitedStatuses.has(getEntry(trail.id).status)).length;
  const planned = trails.filter((trail) => plannedStatuses.has(getEntry(trail.id).status)).length;
  const milesVisited = trails
    .filter((trail) => visitedStatuses.has(getEntry(trail.id).status))
    .reduce((sum, trail) => sum + Number(trail.distanceMi || 0), 0);

  elements.stats.replaceChildren(
    stat("Visited", visited),
    stat("Planned", planned),
    stat("Remaining", Math.max(total - visited, 0)),
    stat("Miles Logged", milesVisited.toFixed(1))
  );
}

function stat(label, value) {
  const item = document.createElement("div");
  item.className = "stat";
  item.innerHTML = `<strong>${escapeHtml(String(value))}</strong><span>${escapeHtml(label)}</span>`;
  return item;
}

function renderRouteVisual() {
  const mapTrails = getParkFilteredTrails();
  const pointByTrailId = layoutTrailPoints(mapTrails);
  const pins = mapTrails.map((trail) => renderMapPin(trail, pointByTrailId.get(trail.id))).join("");
  const groupCounts = countNationalParkGroups(mapTrails);
  const activeTrail = mapTrails.find((trail) => trail.id === activeTrailId) || mapTrails[0] || trails[0];

  elements.routeVisual.innerHTML = `
    <div class="map-shell">
      <div class="map-canvas" role="group" aria-label="Interactive geographic map of well-known hiking trail locations across California">
        ${mapBackdrop()}
        <div class="map-pin-layer">
          ${renderNationalParkGroupLabels(groupCounts)}
          ${renderLeaderLines(pointByTrailId)}
          ${pins}
        </div>
        ${renderNationalParkLegend(groupCounts)}
      </div>
      <section class="map-panel" aria-label="Selected trail details" aria-live="polite">
        ${renderMapPanel(activeTrail)}
      </section>
    </div>`;
}

function renderMapPin(trail, point = projectTrail(trail)) {
  const entry = getEntry(trail.id);
  const group = getNearestNationalPark(trail);
  const status = entry.status || "Want to go";
  const active = trail.id === activeTrailId ? " active" : "";
  const tooltipAlign = point.x > 82 ? " tooltip-left" : point.x < 18 ? " tooltip-right" : "";
  const statusClass = visitedStatuses.has(status) ? " visited" : plannedStatuses.has(status) ? " planned" : "";
  const style = `left: ${point.x}%; top: ${point.y}%; --group-color: ${group.color};`;
  return `
    <button
      class="map-pin${statusClass}${active}${tooltipAlign}"
      type="button"
      data-id="${escapeHtml(trail.id)}"
      data-group="${escapeHtml(group.id)}"
      style="${style}"
      aria-label="${escapeHtml(`${trail.trail}, ${trail.area}, nearest national park group ${group.name}, community difficulty ${trail.communityDifficulty} out of 10`)}"
      title="${escapeHtml(`${trail.trail} - nearest ${group.name}`)}"
    >
      <span class="map-pin-dot" aria-hidden="true"></span>
      <span class="map-tooltip" role="tooltip">
        <strong>${escapeHtml(trail.trail)}</strong>
        <span>${escapeHtml(trail.area)}</span>
        <small>Nearest: ${escapeHtml(group.name)}</small>
      </span>
    </button>`;
}

function renderNationalParkGroupLabels(groupCounts) {
  return nationalParkGroups
    .filter((group) => groupCounts.get(group.id))
    .map((group) => {
      const point = projectLatLng(group.lat, group.lng);
      const x = clamp(point.x + group.labelOffset.x, 3, 84);
      const y = clamp(point.y + group.labelOffset.y, 4, 94);
      return `
        <div class="map-group-label" style="left: ${x}%; top: ${y}%; --group-color: ${group.color};">
          <span>${escapeHtml(group.name)}</span>
          <strong>${groupCounts.get(group.id)}</strong>
        </div>`;
    })
    .join("");
}

function renderNationalParkLegend(groupCounts) {
  const items = nationalParkGroups
    .filter((group) => groupCounts.get(group.id))
    .map((group) => `
      <span class="map-legend-item" style="--group-color: ${group.color};">
        <i aria-hidden="true"></i>${escapeHtml(group.name)}
      </span>`)
    .join("");

  return `
    <div class="map-legend" aria-label="Nearest national park dot colors">
      <b>Nearest National Park</b>
      ${items}
    </div>`;
}

function renderLeaderLines(pointByTrailId) {
  const lines = getParkFilteredTrails()
    .map((trail) => {
      const point = pointByTrailId.get(trail.id) || projectTrail(trail, false);
      const anchor = { x: point.trueX ?? point.x, y: point.trueY ?? point.y };
      const distance = Math.hypot(point.x - anchor.x, point.y - anchor.y);
      if (distance < 1.4) return "";
      return `<line class="pin-leader" x1="${anchor.x.toFixed(2)}" y1="${anchor.y.toFixed(2)}" x2="${point.x.toFixed(2)}" y2="${point.y.toFixed(2)}"></line>`;
    })
    .join("");

  return `
    <svg class="pin-leader-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      ${lines}
    </svg>`;
}

function renderMapPanel(trail) {
  const entry = getEntry(trail.id);
  const sourceLinks = (trail.communityDifficultySources || [])
    .map((source) => `<a href="${escapeHtml(source.url)}" data-tree-label="${escapeHtml(source.name)}" aria-label="${escapeHtml(source.name)}" target="_blank" rel="noreferrer"><span class="tree-label">${escapeHtml(source.name)}</span></a>`)
    .join("");

  return `
    <section data-id="${escapeHtml(trail.id)}">
      <p class="trail-stage">Trail ${escapeHtml(String(trail.stage))} - ${escapeHtml(trail.segment)}</p>
      <h3>${escapeHtml(trail.area)}: ${escapeHtml(trail.trail)}</h3>
      <p class="trail-meta">${escapeHtml(trail.baseTown)} | ${trail.distanceMi} mi | ${trail.elevationFt.toLocaleString()} ft gain | ${escapeHtml(trail.time)}</p>
      <p class="nearest-park">Nearest national park group: ${escapeHtml(getNearestNationalPark(trail).name)}</p>
      ${difficultyMeter(trail)}
      <p class="difficulty-basis">${escapeHtml(trail.communityDifficultyBasis)}</p>
      ${weatherMarkup(trail)}
      <form class="visit-form map-form">
        ${fieldMarkup("Status", "status", "select", entry.status || "Want to go")}
        ${fieldMarkup("Date Visited", "dateVisited", "date", entry.dateVisited || "")}
        ${fieldMarkup("Rating", "rating", "number", entry.rating || "")}
        ${fieldMarkup("Repeat?", "repeat", "select-repeat", entry.repeat || "")}
        ${fieldMarkup("Trail Partner", "partner", "text", entry.partner || "", "wide")}
        ${fieldMarkup("Personal Notes", "notes", "textarea", entry.notes || "", "wide")}
        ${fieldMarkup("Accessibility Notes", "accessibilityNotes", "textarea", entry.accessibilityNotes || "", "wide")}
      </form>
      <div class="trail-links">
        <a href="${escapeHtml(trail.officialUrl)}" data-tree-label="Official info" aria-label="Official info" target="_blank" rel="noreferrer"><span class="tree-label">Official info</span></a>
        <a href="${escapeHtml(trail.mapUrl)}" data-tree-label="Open map" aria-label="Open map" target="_blank" rel="noreferrer"><span class="tree-label">Open map</span></a>
      </div>
      <div class="source-links" aria-label="Difficulty sources">${sourceLinks}</div>
      <div class="entry-footer">
        <button class="back-to-top" type="button" data-back-to-top>Back to the Top</button>
      </div>
    </section>`;
}

function fieldMarkup(label, field, type, value, className = "") {
  const id = `map-${activeTrailId}-${field}`;
  if (type === "select") {
    const options = statuses.map((status) => optionMarkup(status, status === value)).join("");
    return `<div class="field ${className}"><label for="${escapeHtml(id)}">${escapeHtml(label)}</label><select id="${escapeHtml(id)}" data-field="${escapeHtml(field)}">${options}</select></div>`;
  }
  if (type === "select-repeat") {
    const options = ["", "Yes", "Maybe", "No"].map((repeat) => optionMarkup(repeat, repeat === value)).join("");
    return `<div class="field ${className}"><label for="${escapeHtml(id)}">${escapeHtml(label)}</label><select id="${escapeHtml(id)}" data-field="${escapeHtml(field)}">${options}</select></div>`;
  }
  if (type === "textarea") {
    return `<div class="field ${className}"><label for="${escapeHtml(id)}">${escapeHtml(label)}</label><textarea id="${escapeHtml(id)}" data-field="${escapeHtml(field)}" rows="3">${escapeHtml(value)}</textarea></div>`;
  }
  const attrs = field === "rating" ? ' min="0" max="5" step="0.5" inputmode="decimal" placeholder="0-5"' : "";
  return `<div class="field ${className}"><label for="${escapeHtml(id)}">${escapeHtml(label)}</label><input id="${escapeHtml(id)}" data-field="${escapeHtml(field)}" type="${escapeHtml(type)}" value="${escapeHtml(value)}"${attrs}></div>`;
}

function optionMarkup(value, selected) {
  const label = value || "";
  return `<option value="${escapeHtml(value)}"${selected ? " selected" : ""}>${escapeHtml(label)}</option>`;
}

function countNationalParkGroups(trailList = trails) {
  const counts = new Map(nationalParkGroups.map((group) => [group.id, 0]));
  for (const trail of trailList) {
    const group = getNearestNationalPark(trail);
    counts.set(group.id, (counts.get(group.id) || 0) + 1);
  }
  return counts;
}

function getNearestNationalPark(trail) {
  if (groupCache.has(trail.id)) return groupCache.get(trail.id);

  let nearest = nationalParkGroups[0];
  let bestDistance = Number.POSITIVE_INFINITY;
  for (const group of nationalParkGroups) {
    const distance = milesBetween(trail.lat, trail.lng, group.lat, group.lng);
    if (distance < bestDistance) {
      nearest = group;
      bestDistance = distance;
    }
  }

  const result = { ...nearest, distanceMi: bestDistance };
  groupCache.set(trail.id, result);
  return result;
}

function milesBetween(lat1, lng1, lat2, lng2) {
  const earthRadiusMi = 3958.8;
  const toRad = (value) => value * (Math.PI / 180);
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return earthRadiusMi * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function layoutTrailPoints(trailList = trails) {
  const points = trailList.map((trail, index) => {
    const truePoint = projectTrail(trail, false);
    const offsetPoint = projectTrail(trail);
    const group = getNearestNationalPark(trail);
    const groupPoint = projectLatLng(group.lat, group.lng);
    const anchor = {
      x: clamp((truePoint.x * 0.72) + (groupPoint.x * 0.28), 4, 96),
      y: clamp((truePoint.y * 0.72) + (groupPoint.y * 0.28), 4, 96)
    };
    const point = {
      x: clamp((offsetPoint.x * 0.72) + (groupPoint.x * 0.28), 4, 96),
      y: clamp((offsetPoint.y * 0.72) + (groupPoint.y * 0.28), 4, 96)
    };
    return {
      ...point,
      anchorX: anchor.x,
      anchorY: anchor.y,
      trueX: truePoint.x,
      trueY: truePoint.y,
      groupId: group.id,
      id: trail.id,
      index
    };
  });
  const minDistance = 3.35;

  for (let iteration = 0; iteration < 80; iteration += 1) {
    for (let i = 0; i < points.length; i += 1) {
      for (let j = i + 1; j < points.length; j += 1) {
        const a = points[i];
        const b = points[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let distance = Math.hypot(dx, dy);

        if (distance >= minDistance) continue;

        if (distance < 0.01) {
          const angle = (((i + 1) * 61 + (j + 1) * 37) % 360) * (Math.PI / 180);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          distance = 1;
        }

        const push = (minDistance - distance) / 2;
        const ux = dx / distance;
        const uy = dy / distance;
        a.x -= ux * push;
        a.y -= uy * push;
        b.x += ux * push;
        b.y += uy * push;
      }
    }

    for (const point of points) {
      point.x += (point.anchorX - point.x) * 0.012;
      point.y += (point.anchorY - point.y) * 0.012;
      point.x = clamp(point.x, 4, 96);
      point.y = clamp(point.y, 4, 96);
    }
  }

  return new Map(points.map((point) => [point.id, point]));
}

function projectTrail(trail, includeOffset = true) {
  const { x: xRaw, y: yRaw } = projectLatLng(trail.lat, trail.lng);
  const offset = includeOffset ? mapOffsets[trail.id] || { x: 0, y: 0 } : { x: 0, y: 0 };
  return {
    x: clamp(xRaw + offset.x, 4, 96),
    y: clamp(yRaw + offset.y, 4, 96)
  };
}

function projectLatLng(lat, lng) {
  return {
    x: ((lng - mapBounds.west) / (mapBounds.east - mapBounds.west)) * 100,
    y: ((mapBounds.north - lat) / (mapBounds.north - mapBounds.south)) * 100
  };
}

function svgPoint(lng, lat) {
  return {
    x: ((lng - mapBounds.west) / (mapBounds.east - mapBounds.west)) * mapViewBox.width,
    y: ((mapBounds.north - lat) / (mapBounds.north - mapBounds.south)) * mapViewBox.height
  };
}

function geoPath(points, close = false) {
  const path = points
    .map(([lng, lat], index) => {
      const point = svgPoint(lng, lat);
      return `${index ? "L" : "M"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
    })
    .join(" ");
  return close ? `${path} Z` : path;
}

function cityMarker(lng, lat, label) {
  const point = svgPoint(lng, lat);
  return `
    <g class="city-marker">
      <circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4"></circle>
      <text x="${(point.x + 10).toFixed(1)}" y="${(point.y + 4).toFixed(1)}">${escapeHtml(label)}</text>
    </g>`;
}

function placeMarker(lng, lat, label) {
  const point = svgPoint(lng, lat);
  return `
    <g class="place-marker">
      <path d="M ${point.x.toFixed(1)} ${(point.y - 36).toFixed(1)} h 86 a 9 9 0 0 1 9 9 v 24 a 9 9 0 0 1 -9 9 h -34 l -12 14 l -12 -14 h -28 a 9 9 0 0 1 -9 -9 v -24 a 9 9 0 0 1 9 -9 Z"></path>
      <circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="5"></circle>
      <text x="${(point.x + 12).toFixed(1)}" y="${(point.y - 12).toFixed(1)}">${escapeHtml(label)}</text>
    </g>`;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function renderTrailList() {
  const search = elements.search.value.trim().toLowerCase();
  const segment = elements.segmentFilter.value;
  const status = elements.statusFilter.value;
  const parkFilteredTrails = getParkFilteredTrails();
  const visibleTrails = parkFilteredTrails.filter((trail) => {
    const entryStatus = getEntry(trail.id).status || "Want to go";
    const parkGroup = getNearestNationalPark(trail).name;
    const haystack = `${trail.area} ${trail.trail} ${trail.baseTown} ${trail.segment} ${trail.setting} ${parkGroup}`.toLowerCase();
    return (
      (!search || haystack.includes(search)) &&
      (segment === "all" || trail.segment === segment) &&
      (status === "all" || entryStatus === status)
    );
  });

  const activeGroup = getActiveParkGroup();
  elements.resultCount.textContent = activeGroup
    ? `${visibleTrails.length} of ${parkFilteredTrails.length} near ${activeGroup.name}`
    : `${visibleTrails.length} of ${trails.length}`;
  elements.trailList.replaceChildren(...visibleTrails.map(renderTrailCard));

  if (!visibleTrails.length) {
    const empty = document.createElement("p");
    empty.className = "empty-state";
    empty.textContent = "No trails match the current filters.";
    elements.trailList.append(empty);
  }
}

function renderTrailCard(trail) {
  const fragment = elements.template.content.cloneNode(true);
  const card = fragment.querySelector(".trail-card");
  const entry = getEntry(trail.id);
  card.dataset.id = trail.id;
  updateStatusForContainer(card, entry.status);

  fragment.querySelector("h3").textContent = `${trail.area}: ${trail.trail}`;
  fragment.querySelector(".trail-stage").textContent = `Trail ${trail.stage} - ${trail.segment}`;
  fragment.querySelector(".trail-meta").textContent = `${trail.baseTown} | ${trail.distanceMi} mi | ${trail.elevationFt.toLocaleString()} ft gain | ${trail.time}`;
  fragment.querySelector(".route-copy").textContent = trail.routeIdea;

  const badges = fragment.querySelector(".trail-badges");
  badges.replaceChildren(
    badge(trail.priority, "clay"),
    badge(`${trail.communityDifficulty}/10`, difficultyTone(trail.communityDifficulty)),
    badge(trail.setting)
  );

  const details = fragment.querySelector(".trail-details");
  addDetail(details, "Caution", trail.currentCaution);
  addDetail(details, "Trail Label", trail.difficulty);
  addDetail(details, "Nearest National Park", getNearestNationalPark(trail).name);
  addDetail(details, "Distance", `${trail.distanceMi} mi`);
  addDetail(details, "Elevation", `${trail.elevationFt.toLocaleString()} ft`);
  const meterWrap = document.createElement("div");
  meterWrap.className = "detail-wide";
  meterWrap.innerHTML = difficultyMeter(trail);
  details.append(meterWrap);
  addDetail(details, "Community Signal", trail.communityDifficultyBasis, "detail-wide");
  details.insertAdjacentHTML("afterend", weatherMarkup(trail));

  const form = fragment.querySelector(".visit-form");
  form.querySelectorAll("[data-field]").forEach((control) => {
    const label = control.closest(".field").querySelector("label");
    const id = `${trail.id}-${control.dataset.field}`;
    control.id = id;
    label.setAttribute("for", id);
    if (control.dataset.field === "status") {
      for (const option of statuses) {
        control.append(new Option(option, option));
      }
    }
    control.value = entry[control.dataset.field] || "";
  });

  fragment.querySelector('[data-link="official"]').href = trail.officialUrl;
  fragment.querySelector('[data-link="map"]').href = trail.mapUrl;

  const sourceLinks = document.createElement("div");
  sourceLinks.className = "source-links";
  sourceLinks.setAttribute("aria-label", "Difficulty sources");
  sourceLinks.innerHTML = (trail.communityDifficultySources || [])
    .map((source) => `<a href="${escapeHtml(source.url)}" data-tree-label="${escapeHtml(source.name)}" aria-label="${escapeHtml(source.name)}" target="_blank" rel="noreferrer"><span class="tree-label">${escapeHtml(source.name)}</span></a>`)
    .join("");
  fragment.querySelector(".trail-links").after(sourceLinks);

  return fragment;
}

function difficultyMeter(trail) {
  const score = Number(trail.communityDifficulty || 0);
  const width = clamp(score * 10, 0, 100);
  return `
    <div class="difficulty-block">
      <div class="difficulty-row">
        <span>Community Difficulty</span>
        <strong>${escapeHtml(String(score))}/10 ${escapeHtml(trail.communityDifficultyLabel || "")}</strong>
      </div>
      <div class="difficulty-meter" role="meter" aria-valuemin="1" aria-valuemax="10" aria-valuenow="${escapeHtml(String(score))}" aria-valuetext="${escapeHtml(`${score} out of 10, ${trail.communityDifficultyLabel}`)}">
        <span style="width: ${width}%"></span>
      </div>
    </div>`;
}

function weatherMarkup(trail) {
  return `
    <section class="weather-block" data-weather-id="${escapeHtml(trail.id)}">
      ${weatherContentMarkup(trail)}
    </section>`;
}

function weatherContentMarkup(trail) {
  const forecast = weatherByTrailId[trail.id];
  const refreshed = weatherStatus.updatedAt ? `Updated ${formatWeatherUpdated(weatherStatus.updatedAt)}` : "Live forecast";
  const status = weatherStatus.loading ? "Updating..." : refreshed;

  if (forecast && forecast.days && forecast.days.length) {
    return `
      <div class="weather-heading">
        <div>
          <h4>7-Day Trail Weather</h4>
          <p>${escapeHtml(status)} from Open-Meteo</p>
        </div>
        <button class="weather-refresh" type="button" data-weather-refresh="${escapeHtml(trail.id)}" aria-label="Refresh weather for all trails">Refresh</button>
      </div>
      <div class="weather-days">
        ${forecast.days.map(weatherDayMarkup).join("")}
      </div>`;
  }

  const message = weatherStatus.error || (weatherStatus.loading ? "Loading live forecast..." : "Weather loads when this page is online.");
  return `
    <div class="weather-heading">
      <div>
        <h4>7-Day Trail Weather</h4>
        <p>${escapeHtml(message)}</p>
      </div>
      <button class="weather-refresh" type="button" data-weather-refresh="${escapeHtml(trail.id)}" aria-label="Refresh weather for all trails">Refresh</button>
    </div>
    <div class="weather-placeholder">Forecast will appear here automatically.</div>`;
}

function weatherDayMarkup(day) {
  return `
    <article class="weather-day">
      <div class="weather-day-top">
        <strong>${escapeHtml(formatWeatherDay(day.date))}</strong>
        ${weatherIconMarkup(day.weatherCode)}
      </div>
      <span class="weather-condition">${escapeHtml(day.summary)}</span>
      <b>${Math.round(day.high)}&deg; / ${Math.round(day.low)}&deg;F</b>
      <small>Rain ${day.precipProbability ?? 0}% | Wind ${Math.round(day.windMax ?? 0)} mph</small>
    </article>`;
}

function weatherIconMarkup(code) {
  const type = weatherIconType(code);
  const common = 'class="weather-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"';

  if (type === "sun") {
    return `
      <svg ${common}>
        <circle class="weather-sun-fill" cx="24" cy="24" r="8"></circle>
        <g class="weather-sun-rays">
          <line x1="24" y1="4" x2="24" y2="10"></line>
          <line x1="24" y1="38" x2="24" y2="44"></line>
          <line x1="4" y1="24" x2="10" y2="24"></line>
          <line x1="38" y1="24" x2="44" y2="24"></line>
          <line x1="10" y1="10" x2="14" y2="14"></line>
          <line x1="34" y1="34" x2="38" y2="38"></line>
          <line x1="38" y1="10" x2="34" y2="14"></line>
          <line x1="14" y1="34" x2="10" y2="38"></line>
        </g>
      </svg>`;
  }

  if (type === "partly") {
    return `
      <svg ${common}>
        <circle class="weather-sun-fill" cx="17" cy="17" r="7"></circle>
        <path class="weather-cloud-fill" d="M17 35h18a8 8 0 0 0 0-16c-1.3 0-2.5.3-3.6.8A11 11 0 0 0 10.8 24 6 6 0 0 0 17 35Z"></path>
      </svg>`;
  }

  if (type === "fog") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <g class="weather-lines">
          <line x1="10" y1="35" x2="38" y2="35"></line>
          <line x1="7" y1="41" x2="31" y2="41"></line>
        </g>
      </svg>`;
  }

  if (type === "rain") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <g class="weather-rain">
          <line x1="16" y1="35" x2="13" y2="42"></line>
          <line x1="25" y1="35" x2="22" y2="42"></line>
          <line x1="34" y1="35" x2="31" y2="42"></line>
        </g>
      </svg>`;
  }

  if (type === "snow") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <g class="weather-snow">
          <circle cx="16" cy="39" r="2"></circle>
          <circle cx="25" cy="42" r="2"></circle>
          <circle cx="34" cy="39" r="2"></circle>
        </g>
      </svg>`;
  }

  if (type === "storm") {
    return `
      <svg ${common}>
        ${weatherCloudPath()}
        <polygon class="weather-bolt" points="25 33 18 45 27 41 23 48 35 35"></polygon>
      </svg>`;
  }

  return `
    <svg ${common}>
      ${weatherCloudPath()}
    </svg>`;
}

function weatherCloudPath() {
  return '<path class="weather-cloud-fill" d="M15 34h20a8 8 0 0 0 0-16c-1.2 0-2.4.3-3.5.8A11 11 0 0 0 10.7 23 6.2 6.2 0 0 0 15 34Z"></path>';
}

function weatherIconType(code) {
  const weatherCode = Number(code);
  if (weatherCode === 0 || weatherCode === 1) return "sun";
  if (weatherCode === 2) return "partly";
  if (weatherCode === 3) return "cloud";
  if (weatherCode === 45 || weatherCode === 48) return "fog";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(weatherCode)) return "rain";
  if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) return "snow";
  if ([95, 96, 99].includes(weatherCode)) return "storm";
  return "cloud";
}

function formatWeatherDay(date) {
  const parsed = new Date(`${date}T12:00:00`);
  if (Number.isNaN(parsed.getTime())) return date;
  return parsed.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
}

function formatWeatherUpdated(timestamp) {
  const ageMs = Date.now() - timestamp;
  const ageMin = Math.max(0, Math.round(ageMs / 60000));
  if (ageMin < 1) return "just now";
  if (ageMin < 60) return `${ageMin} min ago`;
  const ageHours = Math.round(ageMin / 60);
  return `${ageHours} hr ago`;
}

async function refreshWeather({ force = false } = {}) {
  if (weatherStatus.loading) return;
  if (!force && Date.now() - weatherStatus.updatedAt < WEATHER_REFRESH_MS) return;

  weatherStatus.loading = true;
  weatherStatus.error = "";
  updateWeatherDisplays();

  try {
    weatherByTrailId = await fetchWeatherForTrails(trails);
    weatherStatus.updatedAt = Date.now();
    weatherStatus.error = "";
    saveWeatherCache();
  } catch {
    weatherStatus.error = "Weather is temporarily unavailable.";
  } finally {
    weatherStatus.loading = false;
    updateWeatherDisplays();
  }
}

async function fetchWeatherForTrails(trailList) {
  const result = {};
  const chunks = [];
  for (let i = 0; i < trailList.length; i += WEATHER_BATCH_SIZE) {
    chunks.push(trailList.slice(i, i + WEATHER_BATCH_SIZE));
  }

  const chunkResults = await Promise.all(chunks.map(fetchWeatherBatch));
  for (const chunkResult of chunkResults) {
    Object.assign(result, chunkResult);
  }
  return result;
}

async function fetchWeatherBatch(trailChunk) {
  const params = new URLSearchParams({
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",
    timezone: "auto",
    forecast_days: "7"
  });
  params.set("latitude", trailChunk.map((trail) => Number(trail.lat).toFixed(4)).join(","));
  params.set("longitude", trailChunk.map((trail) => Number(trail.lng).toFixed(4)).join(","));

  const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
  if (!response.ok) throw new Error("Weather request failed");

  const payload = await response.json();
  if (payload.error) throw new Error(payload.reason || "Weather request failed");

  const locations = Array.isArray(payload) ? payload : [payload];
  const result = {};
  trailChunk.forEach((trail, index) => {
    const location = locations[index];
    if (!location || !location.daily) return;
    result[trail.id] = normalizeWeatherForecast(location.daily);
  });
  return result;
}

function normalizeWeatherForecast(daily) {
  const times = daily.time || [];
  return {
    days: times.slice(0, 7).map((date, index) => ({
      date,
      weatherCode: Number(daily.weather_code?.[index] ?? -1),
      summary: weatherCodeText(daily.weather_code?.[index]),
      high: Number(daily.temperature_2m_max?.[index] ?? 0),
      low: Number(daily.temperature_2m_min?.[index] ?? 0),
      precipProbability: Number(daily.precipitation_probability_max?.[index] ?? 0),
      windMax: Number(daily.wind_speed_10m_max?.[index] ?? 0)
    }))
  };
}

function weatherCodeText(code) {
  const weatherCode = Number(code);
  if (weatherCode === 0) return "Clear";
  if (weatherCode === 1) return "Mostly clear";
  if (weatherCode === 2) return "Partly cloudy";
  if (weatherCode === 3) return "Overcast";
  if (weatherCode === 45 || weatherCode === 48) return "Fog";
  if ([51, 53, 55, 56, 57].includes(weatherCode)) return "Drizzle";
  if ([61, 63, 65, 66, 67].includes(weatherCode)) return "Rain";
  if ([71, 73, 75, 77].includes(weatherCode)) return "Snow";
  if ([80, 81, 82].includes(weatherCode)) return "Showers";
  if ([85, 86].includes(weatherCode)) return "Snow showers";
  if ([95, 96, 99].includes(weatherCode)) return "Thunderstorms";
  return "Forecast";
}

function updateWeatherDisplays() {
  document.querySelectorAll("[data-weather-id]").forEach((container) => {
    const trail = trails.find((item) => item.id === container.dataset.weatherId);
    if (!trail) return;
    container.innerHTML = weatherContentMarkup(trail);
  });
}

function updateStatusForTrail(id) {
  const entry = getEntry(id);
  for (const container of findTrailContainers(id)) {
    updateStatusForContainer(container, entry.status);
  }
}

function updateStatusForContainer(container, status = "Want to go") {
  container.dataset.status = status;
}

function syncControls(id, sourceControl) {
  const entry = getEntry(id);
  for (const container of findTrailContainers(id)) {
    container.querySelectorAll("[data-field]").forEach((control) => {
      if (control === sourceControl) return;
      control.value = entry[control.dataset.field] || "";
    });
  }
}

function findTrailContainers(id) {
  return [...document.querySelectorAll("[data-id]")].filter((container) => container.dataset.id === id);
}

function badge(text, tone = "") {
  const item = document.createElement("span");
  item.className = `badge ${tone}`.trim();
  item.textContent = text;
  return item;
}

function difficultyTone(score) {
  if (score >= 8) return "hard";
  if (score >= 5) return "clay";
  if (score >= 3) return "gold";
  return "coast";
}

function addDetail(parent, term, description, className = "") {
  const wrapper = document.createElement("div");
  if (className) wrapper.className = className;
  const dt = document.createElement("dt");
  const dd = document.createElement("dd");
  dt.textContent = term;
  dd.textContent = description;
  wrapper.append(dt, dd);
  parent.append(wrapper);
}

function exportCsv() {
  const headers = [
    "Trail #",
    "Segment",
    "Area",
    "Trail",
    "Status",
    "Date Visited",
    "Rating",
    "Repeat",
    "Trail Partner",
    "Personal Notes",
    "Accessibility Notes",
    "Distance Mi",
    "Elevation Ft",
    "Trail Label",
    "Community Difficulty 1-10",
    "Community Difficulty Label",
    "Community Difficulty Basis",
    "Priority",
    "Current Caution",
    "Latitude",
    "Longitude",
    "Official URL",
    "Map URL"
  ];
  const rows = trails.map((trail) => {
    const entry = getEntry(trail.id);
    return [
      trail.stage,
      trail.segment,
      trail.area,
      trail.trail,
      entry.status || "Want to go",
      entry.dateVisited || "",
      entry.rating || "",
      entry.repeat || "",
      entry.partner || "",
      entry.notes || "",
      entry.accessibilityNotes || "",
      trail.distanceMi,
      trail.elevationFt,
      trail.difficulty,
      trail.communityDifficulty,
      trail.communityDifficultyLabel,
      trail.communityDifficultyBasis,
      trail.priority,
      trail.currentCaution,
      trail.lat,
      trail.lng,
      trail.officialUrl,
      trail.mapUrl
    ];
  });
  downloadText("california-hiking-trail-log.csv", toCsv([headers, ...rows]), "text/csv");
}

function exportJson() {
  const payload = {
    name: "California Hiking Trail Roadmap",
    version: 2,
    exportedAt: new Date().toISOString(),
    entries
  };
  downloadText("california-hiking-trail-log-backup.json", JSON.stringify(payload, null, 2), "application/json");
}

function importJson(event) {
  const [file] = event.target.files;
  if (!file) return;

  const reader = new FileReader();
  reader.addEventListener("load", () => {
    try {
      const payload = JSON.parse(String(reader.result));
      if (!payload.entries || typeof payload.entries !== "object") {
        throw new Error("Missing entries");
      }
      entries = payload.entries;
      saveEntries("Imported");
      render();
    } catch {
      elements.saveStatus.textContent = "Import failed";
    } finally {
      event.target.value = "";
    }
  });
  reader.readAsText(file);
}

function toCsv(rows) {
  return rows
    .map((row) =>
      row
        .map((value) => {
          const text = String(value ?? "");
          return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        })
        .join(",")
    )
    .join("\n");
}

function downloadText(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const span = document.createElement("span");
  span.textContent = String(text ?? "");
  return span.innerHTML;
}

try {
  init();
} catch {
  elements.trailList.innerHTML = '<p class="empty-state">Trail data could not be loaded.</p>';
}
